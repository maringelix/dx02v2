# Cloud-mutating and billable: promotes a signed GHCR release to ACR and deploys it to AKS.
# Dispatch from main with the run id of a successful publish-images run. The release is fully
# verified before the lab environment approval and again before Azure credentials are requested.
name: deploy-azure

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful publish-images workflow run id for the release to deploy
        required: true
        type: string
      deploy_mode:
        description: Use Argo CD when available, or force the deployment path
        required: true
        default: auto
        type: choice
        options:
          - auto
          - gitops
          - push
      platform_profile:
        description: Must match the tx02v2 platform profile installed on AKS
        required: true
        default: core
        type: choice
        options:
          - core
          - full

permissions:
  contents: read

concurrency:
  group: dx02v2-lab-deploy
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - name: Require the deployment workflow from main
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "::error::deploy-azure must run from main so the promotion signer has the pinned identity."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the publisher run and release artifact
        id: release
        run: bash scripts/get-publish-run-metadata.sh

      - name: Download the immutable release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dx02v2-release

      - name: Verify source CI, image digests, SBOM checksums, and attestations
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx02v2-release
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: bash scripts/verify-release-bundle.sh

      - name: Preserve the verified bundle for the approved deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx02v2-verified-release
          path: ${{ runner.temp }}/dx02v2-release/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: lab
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
      packages: read
    env:
      AZURE_APPCONFIG_ENDPOINT: ${{ vars.AZURE_APPCONFIG_ENDPOINT }}
      DEPLOY_MODE: ${{ inputs.deploy_mode }}
      PLATFORM_PROFILE: ${{ inputs.platform_profile }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the previously verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dx02v2-verified-release
          path: ${{ runner.temp }}/dx02v2-release

      - name: Re-verify the bundle and signer before requesting Azure credentials
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx02v2-release
        run: bash scripts/verify-release-bundle.sh

      - name: Check repository variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          guid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          problems=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!v}" ]]; then
              problems+=("$v is not set")
            elif [[ ! "${!v}" =~ $guid ]]; then
              problems+=("$v is not a lowercase GUID")
            fi
          done
          if [[ -z "$AZURE_APPCONFIG_ENDPOINT" ]]; then
            problems+=("AZURE_APPCONFIG_ENDPOINT is not set")
          elif [[ ! "$AZURE_APPCONFIG_ENDPOINT" =~ ^https://tx02v2-lab-[0-9a-f]{8}\.azconfig\.io/?$ ]]; then
            problems+=("AZURE_APPCONFIG_ENDPOINT is not https://tx02v2-lab-<suffix>.azconfig.io")
          fi
          if ((${#problems[@]} > 0)); then
            printf '::error::Repository variable problem: %s\n' "${problems[@]}"
            echo "::error::Settings > Secrets and variables > Actions > Variables; see docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi

      - name: Authenticate to GHCR for the verified image digests
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install kubectl and kubelogin (pinned, SHA256-verified)
        run: bash scripts/install-tools.sh kubectl kubelogin

      # Right before the deploy: the GitHub OIDC assertion lives 5-10 minutes.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Promote the verified image digests to ACR (no rebuild)
        id: promote
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx02v2-release
        run: bash scripts/deploy-azure.sh --promote-only

      - name: Authenticate to ACR for promotion attestations
        env:
          ACR_NAME: ${{ steps.promote.outputs.acr_name }}
        run: az acr login --name "$ACR_NAME" --only-show-errors

      - name: Write the ACR promotion predicates
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx02v2-release
          API_ACR_NAME: ${{ steps.promote.outputs.api_name }}
          API_ACR_DIGEST: ${{ steps.promote.outputs.api_digest }}
          WEB_ACR_NAME: ${{ steps.promote.outputs.web_name }}
          WEB_ACR_DIGEST: ${{ steps.promote.outputs.web_digest }}
        run: bash scripts/write-promotion-statements.sh

      - name: Attest the promoted API image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promote.outputs.api_name }}
          subject-digest: ${{ steps.promote.outputs.api_digest }}
          predicate-type: https://github.com/maringelix/tx00v2/attestations/promoted-image/v1
          predicate-path: ${{ runner.temp }}/dx02v2-promotion/api.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest the promoted web image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.promote.outputs.web_name }}
          subject-digest: ${{ steps.promote.outputs.web_digest }}
          predicate-type: https://github.com/maringelix/tx00v2/attestations/promoted-image/v1
          predicate-path: ${{ runner.temp }}/dx02v2-promotion/web.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify the ACR promotion signatures, workflow identity, and source commit
        env:
          API_ACR_NAME: ${{ steps.promote.outputs.api_name }}
          API_ACR_DIGEST: ${{ steps.promote.outputs.api_digest }}
          WEB_ACR_NAME: ${{ steps.promote.outputs.web_name }}
          WEB_ACR_DIGEST: ${{ steps.promote.outputs.web_digest }}
        run: |
          set -euo pipefail
          expected_workflow="$GITHUB_REPOSITORY/.github/workflows/deploy-azure.yml"
          predicate_type='https://github.com/maringelix/tx00v2/attestations/promoted-image/v1'
          for component in api web; do
            image_name_var="${component^^}_ACR_NAME"
            image_digest_var="${component^^}_ACR_DIGEST"
            image_name="${!image_name_var}"
            image_digest="${!image_digest_var}"
            gh attestation verify "oci://$image_name@$image_digest" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type "$predicate_type" \
              --signer-workflow "$expected_workflow" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: Deploy the now-attested image digests
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx02v2-release
        run: bash scripts/deploy-azure.sh

      - name: Remove GHCR credentials
        if: always()
        env:
          ACR_REGISTRY: ${{ steps.promote.outputs.acr_login_server }}
        run: |
          docker logout ghcr.io
          if [[ -n "$ACR_REGISTRY" ]]; then docker logout "$ACR_REGISTRY"; fi
