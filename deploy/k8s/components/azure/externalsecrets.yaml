# Contract: External Secrets Operator (installed by tx02v2) copies the Key Vault secrets into
# the Secrets the pods read, through the ClusterSecretStore azure-key-vault (workload identity
# tx02v2-lab-eso). tx02v2-lab-db-app holds JSON: each property becomes one DB_* key. The deployer
# role may only read Secrets; ESO writes them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: tx02v2-lab-db-app
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: tx02v2-lab-db-app
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: tx02v2-lab-db-app
        property: dbname
    - secretKey: DB_USER
      remoteRef:
        key: tx02v2-lab-db-app
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: tx02v2-lab-db-app
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: tx02v2-lab-app-admin-token
