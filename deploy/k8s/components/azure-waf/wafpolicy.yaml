# Contract: the Azure WAF policy of tx02v2 (Prevention, DRS 2.1 + Bot Manager 1.1, request body
# inspection up to 128 KB) protects every listener of the Gateway. Its resource ID comes from
# App Configuration (tx02v2/lab/waf/policy-id); with the literal `none` (tx02v2 enable_waf = false)
# scripts/deploy-azure.sh renders overlays/azure, which has no WebApplicationFirewallPolicy. The
# SecurityPolicy child resource of the AGC that allows this policy belongs to tx02v2.
apiVersion: alb.networking.azure.io/v1
kind: WebApplicationFirewallPolicy
metadata:
  name: dx02v2
  labels:
    app.kubernetes.io/name: dx02v2
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: dx02v2
  webApplicationFirewall:
    id: replaced-from-deploy-params
