# Secrets of contract v1 from the ClusterSecretStore local-secrets of tx02v2 (the local twin of Key
# Vault): same target Secrets and keys as the azure component. In Key Vault the admin token is a plain
# string; the local twin keeps it under the key token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-secrets
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: tx02v2-lab-db-app
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: tx02v2-lab-db-app
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: tx02v2-lab-db-app
        property: dbname
    - secretKey: DB_USER
      remoteRef:
        key: tx02v2-lab-db-app
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: tx02v2-lab-db-app
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: local-secrets
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: tx02v2-lab-app-admin-token
        property: token
