# Edges of the local lab on top of the zero-trust base. In the ambient mesh, pod-to-pod traffic travels
# as HBONE on port 15008 of the destination pod (ztunnel), and kubelet probes arrive from the
# link-local address 169.254.7.127 (https://istio.io/latest/docs/ambient/usage/networkpolicy/): both
# have to be allowed next to the application ports. The Gateway pods (created by Istio for the Gateway
# dx02v2) are not in the mesh themselves; ingress-use-waypoint sends their traffic to the waypoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress-from-load-balancer
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: dx02v2
  policyTypes: [Ingress]
  ingress:
    # The load balancer emulator and the kubelet reach the Gateway from the lab network (NETWORK_CIDR).
    - from:
        - ipBlock:
            cidr: 10.251.0.0/24
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 15021
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: dx02v2
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: dx02v2-waypoint
      ports:
        - protocol: TCP
          port: 15008
    # Configuration (xDS) and certificates from istiod.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
      ports:
        - protocol: TCP
          port: 15012
    # Its spans (OTLP/gRPC) to the OpenTelemetry Collector: the Collector is in the mesh, so the Gateway
    # carries them over HBONE (15008) to the Collector pod, as it does for the app.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress-mesh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: dx02v2-waypoint
      ports:
        - protocol: TCP
          port: 15008
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress-mesh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: dx02v2-waypoint
      ports:
        - protocol: TCP
          port: 15008
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-egress-mesh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: dx02v2-waypoint
      ports:
        - protocol: TCP
          port: 15008
---
# The traces of the API (OTLP/HTTP, contract key tracing.otlp-endpoint) to the OpenTelemetry Collector
# of tx02v2, through the mesh (HBONE).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress-to-collector
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 15008
---
# The database of the local lab, on the lab network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress-to-db
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.251.0.11/32
      ports:
        - protocol: TCP
          port: 5432
