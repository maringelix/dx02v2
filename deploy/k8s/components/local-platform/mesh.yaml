# Istio ambient (the namespace dx02v2 is in the mesh, label set by tx02v2): mTLS STRICT between every
# pod and identity-based L4 authorization enforced by ztunnel. v1 shipped PeerAuthentication PERMISSIVE
# with no sidecars at all (docs/LICOES_APRENDIDAS.md of tx03v2); here the e2e proves both.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: STRICT
---
# The waypoint checks original client identities and HTTP traffic. ztunnel permits only the waypoint
# to reach API/web pods, so a client cannot bypass the L7 policy with a pod-IP connection.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-require-waypoint
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/dx02v2/sa/dx02v2-waypoint
      to:
        - operation:
            ports: ['3000', '9464']
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api
spec:
  targetRefs:
    - group: ''
      kind: Service
      name: api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/dx02v2/sa/web
              - cluster.local/ns/dx02v2/sa/dx02v2-istio
      to:
        - operation:
            ports: ['3000']
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/kube-prometheus-stack-prometheus
      to:
        - operation:
            ports: ['9464']
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/opentelemetry-collector
      to:
        - operation:
            ports: ['3000']
            paths: ['/readyz']
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: web-require-waypoint
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/dx02v2/sa/dx02v2-waypoint
      to:
        - operation:
            ports: ['8080']
---
# web: only the Gateway.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: web
spec:
  targetRefs:
    - group: ''
      kind: Service
      name: web
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/dx02v2/sa/dx02v2-istio
      to:
        - operation:
            ports: ['8080']
