# The full overlay keeps HTTP-01 renewals working after the namespace default-deny policy is
# installed. Only cert-manager's temporary solver pods receive port 8089 from the AGC subnet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver-ingress-from-agc
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: 'true'
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - protocol: TCP
          port: 8089
