apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dx02v2-http-redirect
spec:
  parentRefs:
    - name: dx02v2
      sectionName: http
  hostnames:
    - replaced-from-deploy-params
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
