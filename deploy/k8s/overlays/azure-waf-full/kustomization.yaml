# AKS lab cluster of tx02v2 with the full platform profile and its optional AGC WAF policy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dx02v2
resources:
  - ../../base
  - gitops-revision.yaml
components:
  - ../../components/azure
  - ../../components/azure-https
  - ../../components/azure-waf
  - ../../components/mesh-full
