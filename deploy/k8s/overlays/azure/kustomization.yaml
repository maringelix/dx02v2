# AKS lab cluster of tx02v2 without the WAF policy (App Configuration tx02v2/lab/waf/policy-id is
# `none`). Rendered and applied by scripts/deploy-azure.sh from a temporary copy that contains
# components/azure/params.env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dx02v2
resources:
  - ../../base
components:
  - ../../components/azure
