# Environment-neutral manifests of the dx02v2 app (namespace-scoped only). Overlays:
#   overlays/local      kind: namespace, PostgreSQL StatefulSet, local images
#   overlays/azure      AKS (tx02v2): Gateway + HTTPRoute (AGC), health check policies,
#                       ExternalSecrets, HPA, subnet-CIDR policies, ACR images
#   overlays/azure-waf  same as azure plus the WebApplicationFirewallPolicy on the Gateway
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: dx02v2
    includeSelectors: false
    includeTemplates: true
resources:
  - serviceaccounts.yaml
  - configmap.yaml
  - api.yaml
  - web.yaml
  - services.yaml
  - pdb.yaml
  - networkpolicies.yaml
